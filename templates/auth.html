{% extends 'base.html' %}{% block content %}<section class="auth"><h2>{{'Create student account' if register else 'Login to Placement Portal'}}</h2><form method="post"><input type="hidden" name="csrf" value="{{session.csrf}}">{% if register %}<label>Name<input name="name" required></label><label>CGPA<input name="cgpa" type="number" min="0" max="10" step="0.01" required></label>{% endif %}<label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button>{{'Register' if register else 'Login'}}</button></form><p><a href="{{'/login' if register else '/register'}}">{{'Login' if register else 'Create account'}}</a></p></section>{% endblock %}
